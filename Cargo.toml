[package]
name = "cron-task-scheduler"
version = "0.1.7"
edition = "2021"
authors = ["Davide Listello <davide.listello@gmail.com>"]
license = "SSPL-1.0"
description = "A high-performance async cron scheduler for Rust, supporting both async and blocking tasks with fine-grained scheduling policies."
repository = "https://github.com/davidelistello/cron-task-scheduler"
homepage = "https://github.com/davidelistello/cron-task-scheduler"
documentation = "https://docs.rs/cron-task-scheduler"
keywords = ["cron", "scheduler", "async", "tokio", "task"]
categories = ["asynchronous", "concurrency", "date-and-time"]

[dependencies]
anyhow = "1.0.82"
async-trait = "0.1.79"
chrono = "0.4.38"
cron = "0.12.1"
futures = "0.3"
priority-queue = "1.3.2"
reqwest = { version = "0.11", features = ["json", "gzip"] }
tokio = { version = "1.37.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
uuid = { version = "1.8.0", features = ["v4"] }
num_cpus = "1.17.0"

[lib]
crate-type = ["rlib", "cdylib"]